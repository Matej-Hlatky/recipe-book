---
title: Slané slimáky z lístkového cesta
category: Slané pečivo
ingredients:
  - lístkové cesto
  - 200 g syr Eidam
  - 170 g šunka
  - 50 g kapia
  - 80 g olivy
  - 100 g pór
  - 100 g kečup
  - 1 vajce
  - soľ
steps:
  Príprava:
    - Cesto rozdeliť na polovicu. Jednu dať do chladničky a druhú vyvaľkať na pomúčenej pracovnej doske do tvaru obdĺžnika.
    - Cesto potrieť kečupom, prípadne posypať provensálskymi bylinkami alebo pizza korením.
    - Na kečup poukladať šunku, olivy nakrájané na kolieska, nadrobno nakrájanú kapiu, na tenké kolieska nakrájaný pór a posypať najemno nastrúhaným syrom. Jemne osoliť. Kraje potrieť rozšľahaným vajcom.
    - Zatáčať od spodnej strany k vrchnej ako klasickú roládu.
    - Cesto položiť na dosku na krájanie a opatrne krájať kolieska hrubé 2 cm. Vzniknuté slimáky poukladať vedľa seba na plech. Posypať najemno nastrúhaným syrom.
  Pečenie:
    - Piecť dozlatista (a dochrumkava) v rozohriatej rúre na 200°C cca 20 min.
notes:
  - Podávať na oslavy, svadby, rauty, posedenia s priateľmi a pod.
  - "Čas prípravy: 55 min."
source: http://www.dobre-recepty.sk/fotogaleria/40404-slane-slimaky-z-listkoveho-cesta/
