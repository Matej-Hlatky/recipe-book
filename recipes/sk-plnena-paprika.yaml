---
title: Plnená paprika
category: Rakúsko-Uhorská
ingredients:
  - 500 g bravčové mäso mleté
  - 200 g guľatozrnná ryža
  - 8 ks zelená paprika
  - 2 ks vajce
  - paradajkový pretlak malý
  - 400g paradajkové pyré
  - + plechovka paradajky na pizzu krájané
  - 1 ks cibuľa
  - olej
  - 5 PL kryštálový cukor
  - vegeta
  - majoránka
  - mletá červená sladká paprika
  - cesnak
  - 2 ks bobkový list
  - soľ
  - voda
steps:
  - Ryžu uvariť s jeden a pol násobkom vody so soľou a trochou oleja. Nechať vychladnúť.
  - Mleté mäso zmiešať s vychladnutou ryžou, pridať vajíčka, vegetu, majoránku, ml. červenú papriku, cesnak a soľ. Dôkladne premiešať.
  - Na oleji opražiť paradajkový pretlak s cukrom (omáčka bude krásne červená). Doliať vodou. Paradajkový pretlak a voda v pomere 1:1. Do vriaceho základu pridať očistenú cibuľu v celosti, bobkový list a osoliť podľa chuti.
  - Z papriky vybrať jadierka a naplniť mäsovou hmotou. Dať do vriacej šťavy a variť zhruba hodinku. Naplnenú papriku dať do šťavy ako prvú. Asi po 15 minútach pridať guľky zo zvyšnej mäsovej hmoty a uvariť.
  - Keď sú guľky s paprikou uvarené, vybrať ich a šťavu zahustiť zátrepkou pripravenou z vody a múky. Podľa potreby ešte dochutiť soľou a cukrom.
