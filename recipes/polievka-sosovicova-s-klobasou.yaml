---
title: Šošovicová polievka s klobásou
category: Polievky
ingredients:
  - 100 g šošovice
  - 2 lyžice bravčovej masti
  - 100 g uhorskej klobásy
  - 30 g mrkvy
  - 35 g zeleru
  - 35 g petržlenu
  - 2 cibule
  - 4 strúčiky cesnaku
  - 1 lyžica paradajkového pretlaku
  - 2 bobkové listy
  - 2 lyžice mletej papriky
  - 1,25 l hydinového vývaru
  - 2 lyžice masla
  - 2 lyžice hladkej múky
  - čierne korenie
  - morská soľ
  - čerstvá petržlenová vňať alebo pažítka
steps:
  - Šošovicu zaliať vodou a nechať 2 hodiny odstáť.
  - Na roztopenej masti orestovať nakrájanú klobásu, postupne pridať na menšie kúsky nakrájanú mrkvu, zeler a petržlen, najemno nasekanú cibuľu a cesnak a restovať na strednom plameni 5 – 10 minút.
  - Ochutiť paradajkovým pretlakom, celými bobkovými listami a mletou paprikou (sladkou, štipľavou alebo mixom). Krátko orestovať, pridať šošovicu, podliať vývarom a variť 15 – 20 minút.
  - Tesne pred dokončením pripraviť zápražku – na panvici roztopiť maslo, prisypať múku a na miernom ohni opražiť dotmava. Zápražku pridať do polievky a variť, kým šošovica nezmäkne.
  - Na záver dochutiť soľou a korením.
  - Podávať posypanú nasekanou petržlenovou vňaťou alebo pažítkou, s krajcom chleba.
notes:
  - "Počet porcií: 4"
  - "Doba prípravy: 1 hodina (+ 2 hodiny namáčania šošovice)"
source: https://kuchynalidla.sk/recepty/sosovicova-polievka-s-klobasou
