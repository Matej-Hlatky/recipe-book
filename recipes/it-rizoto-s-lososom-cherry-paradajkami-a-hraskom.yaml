---
title: Rizoto s lososom, cherry paradajkami a hráškom
category: Hlavné jedlá
ingredients:
  - 200 g čerstvého lososa
  - 1 cibuľa
  - olivový olej
  - 2 bobkové listy
  - 150 g ryže arborio
  - 150 ml suchého bieleho vína
  - 1,5 l nesoleného zeleninového vývaru
  - morská soľ
  - čierne korenie
  - 100 g cherry paradajok
  - 100 g mrazeného hrášku
  - 50 g syra Grana Padano
  - 2 lyžice masla
  - šťava z 1/2 citróna
  - 1 hrsť čerstvej bazalky
steps:
  - Cibuľu nasekať nadrobno a podusiť na miernom ohni na troche olivového oleja. Pridať bobkové listy a ryžu a premiešať.
  - Podliať vínom. Keď sa odparí alkohol, pridávať po naberačkách teplý vývar tak, aby bola ryža vždy iba trochu zaliata. Ochutiť soľou a korením.
  - Asi po 10 minútach pridať na kocky nakrájaného lososa bez kože a cherry paradajky prekrojené na polovice. Variť ďalej za občasného podlievania vývarom.
  - Vybrať bobkové listy a pridať rozmrazený hrášok.
  - Keď je ryža uvarená (asi po 20 minútach), pridať nastrúhaný syr, stiahnuť z ohňa a primiešať maslo. Ochutiť citrónovou šťavou a nahrubo nakrájanou bazalkou.
  - Premiešať, zakryť pokrievkou a nechať 2 minúty odpočívať.
  - Podávať ozdobené lístkami bazalky a pokvapkané olivovým olejom.
notes:
  - "Počet porcií: 4"
  - "Doba prípravy: 30 minút"
source: https://kuchynalidla.sk/recepty/rizoto-s-lososom--cherry-paradajkami-a-hraskom
