# yaml-language-server: $schema=./schema.json
---
title: Koložvárska kapusta
category: Rakúsko-Uhorská
ingredients:
  Hlavné suroviny:
    - 800 g kapusta kvasená
    - 500 g bravčové mäso mleté
    - 200 g ryža
    - 2 PL masť bravčová
    - 2 ks cibuľa malá
    - 400 g smotana kyslá
    - 4 ks cesnak
    - (štiplavá) klobása
  Korenie:
    - soľ
    - korenie čierne mleté
    - 2 KL paprika mletá sladká (údená)
steps:
  Príprava surovín:
    - Ryžu variť zvlášť.
    - Na masti osmažiť nasekanú jednu cibuľu a orestovať na nej mleté mäso. Ochutiť soľou, paprikou, korením, podliať trošku vody a podusiť asi 20 minút.
    - Mäso odobrať do misky. Osmažiť klobásku a pridať k mäsu do misky.
    - Na výpeku osmažiť druhú nakrájanú cibuľu a nasekanú kyslú kapustu. Pridať papriku, soľ a korenie podľa chuti a podusiť 10–15 min.
    - V nádobe pripraviť smotanu s pretlačeným cesnakom a korením.
  Vrstvenie:
    - Dať ⅓ kapusty na dno zapekacej nádoby. Na kapustu dať ½ ryže, ½ mäsa a klobásu. Prekryť ½ smotany.
    - Znovu dať vrstvu ⅓ kapusty, ½ ryže a ½ mäsa a klobásu.
    - Zakončiť vrstvou ⅓ kapusty a druhou polovicou smotany.
  Pečenie:
    - Zapekať v rúre na 180 stupňov asi 35 minút — 15 min prikryté a 20 min odokryté.
notes:
  - Dávka na veľkú zapekaciu misu 42×26cm BUREN by IKEA.
