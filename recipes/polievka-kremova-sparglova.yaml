---
title: Krémová špargľová polievka
category: Polievky
ingredients:
  - 500 g bielej špargle
  - 2 stredne veľké zemiaky
  - 1,5 l zeleninového alebo hydinového vývaru
  - morská soľ
  - 2 cibule
  - 1 lyžica masla
  - 2 žĺtky
  - štipka kryštálového cukru
  - čerstvá petržlenová vňať na ozdobu
steps:
  - Zo špargle odrezať drevnaté konce, ošúpať ju a nakrájať na približne 2 cm kúsky; hlavičky odložiť na neskôr.
  - Očistené zemiaky nakrájať na malé kocky. Do teplého vývaru pridať zemiaky a špargľu bez hlavičiek, osoliť a variť na miernom ohni domäkka.
  - Cibuľu nasekať nadrobno, orestovať na masle a pridať do hrnca.
  - V miske vyšľahať žĺtky s trochou studeného vývaru. Polievku stiahnuť z ohňa a primiešať do nej žĺtky. Vrátiť na oheň, ale nenechať zovrieť.
  - Polievku nechať trochu vychladnúť, dochutiť soľou a štipkou cukru a rozmixovať na hladký krém.
  - Hlavičky špargle oblanšírovať v osolenej vriacej vode alebo pripraviť na pare.
  - Polievku podávať ozdobenú hlavičkami špargle a posypanú nasekanou petržlenovou vňaťou.
notes:
  - "Počet porcií: 4"
  - "Doba prípravy: 40 minút"
source: https://kuchynalidla.sk/recepty/kremova-sparglova-polievka
