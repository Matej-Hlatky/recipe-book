---
title: Múčne halušky k mäsu
category: Prílohy
ingredients:
  - 30dg   „miešaná“ múka (½ hladká + ½ hrubá)
  - 1      vajce
  - 2dl    voda
  - 1 č.l. soľ
  - 2 dg   maslo
steps:
  - Do misky dať múku.
  - Vajce rozmiešať so soľou a vodou, vliať do múky a pri miešaní pridávať toľko vody, aby cesto bolo ťahavé (nie pevné a husté).
  - Vo vriacej osolenej vode variť 2 až 3  min; potom vybrať, opláchnuť studenou vodou, nechať  odkvapkať a pomastiť rozpusteným maslom.
