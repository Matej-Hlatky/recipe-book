---
title: Kuracie placky s cuketou
category: Hlavné jedlá
ingredients:
  - 500 g kuracích pŕs
  - 1 cuketa
  - 5 PL strúhaného syra
  - 1 vajce
  - 2 PL Solamylu (alebo maizeny)
  - 1 ČL mletých horčičných semienok
  - 1/2 ČL muškátového orieška
  - mleté čierne korenie
  - 0,5 dl olivového oleja
  - 2 strúčiky cesnaku
  - soľ
steps:
  - Osušené kuracie prsia nakrájať na drobné kúsky alebo tenké rezančeky.
  - V pohári zmiešať olej s horčičnými semienkami, muškátovým orieškom a korením. K mäsu pridať pretlačený cesnak, osoliť, zaliať olejovou zálievkou a nechať postáť aspoň 20 minút.
  - Cuketu so šupkou nahrubo nastrúhať, trochu vyžmýkať a pridať k mäsu spolu so syrom, vajcom a Solamylom.
  - Zmes naberať polievkovou lyžicou na rozpálenú panvicu potretú olejom, urovnať a opiecť z oboch strán dozlatista. Kuracie mäso nepotrebuje veľa času, aby ostalo šťavnaté.
notes:
  - "Počet porcií: 15 placiek"
  - "Doba prípravy: 30 minút"
  - Placky sú výborné samostatne, so šalátom alebo so zemiakmi.
  - Namiesto mäsa sa dajú použiť huby, vtedy bez olejovej zálievky.
source: https://varecha.pravda.sk/recepty/kuracie-placky-s-cuketou-fotorecept/59394-recept.html
