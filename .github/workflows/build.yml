name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get

      - run: dart run bin/main.dart

      - uses: actions/upload-artifact@v4
        with:
          name: recipes
          path: build/recipes.epub
