name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get

      - run: dart run bin/main.dart

      - uses: actions/upload-artifact@v7
        with:
          name: recipes
          path: build/recipes.epub

      - run: dart run bin/site.dart

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: build/site
